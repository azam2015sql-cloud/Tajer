name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build dist folder
        run: |
          mkdir -p dist
          cp index.html manifest.json sw.js dist/
          cp -r css dist/css
          cp -r js dist/js
          cp -r icons dist/icons
          cp -r lib dist/lib

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK (Debug with fixed keystore)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tajer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
